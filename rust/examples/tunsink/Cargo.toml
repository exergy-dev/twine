[package]
name = "tunsink-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of examples/tunsink: TCP length-prefixed frames to a TUN device and Kafka"

# Empty table: not a member of the rust/ workspace, so `cargo build
# --workspace` there never compiles librdkafka.
[workspace]

[[bin]]
name = "tunsink-rs"
path = "src/main.rs"

[dependencies]
twine = { path = "../../twine" }
twine-proto = { path = "../../twine-proto" }
libc = "0.2"
log = "0.4"
crossbeam-channel = "0.5"
rdkafka = { version = "0.38", default-features = false, features = ["cmake-build", "libz-static"] }
rdkafka-sys = { version = "=4.9.0", default-features = false }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
