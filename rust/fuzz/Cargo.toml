[package]
name = "twine-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
twine = { path = "../twine" }
twine-proto = { path = "../twine-proto" }
twine-http = { path = "../twine-http" }

# Standalone: not a member of the root workspace.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "line"
path = "fuzz_targets/line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netstring"
path = "fuzz_targets/netstring.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lengthprefix"
path = "fuzz_targets/lengthprefix.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_parse"
path = "fuzz_targets/http_parse.rs"
test = false
doc = false
bench = false
