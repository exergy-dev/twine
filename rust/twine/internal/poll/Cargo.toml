[package]
name = "twine-poll"
description = "epoll/kqueue poller with eventfd wakeup (twine internal)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = { workspace = true }

[dev-dependencies]
twine-alloccount = { workspace = true }

[features]
# io_uring readiness backend (Linux only). Pulls in the `io-uring` crate.
uring = ["dep:io-uring"]

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }
